name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.dev/**'
      - '.vscode/**'
      - 'tests/**'
      - '*.md'
      - '.gitignore'
      - '.ftpignore'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Validate deployment settings
        id: settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD"; exit 1; }
          test -n "$SERVER_DIR" || { echo "Missing SERVER_DIR"; exit 1; }
          remote_dir="${SERVER_DIR%/}/"
          echo "::add-mask::$remote_dir"
          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Upload runtime files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.settings.outputs.remote_dir }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.dev/**
            **/.vscode/**
            **/tests/**
            **/*.md
            **/.ftpignore
            **/.env*
            **/*.log
            **/Thumbs.db
            **/.DS_Store
            **/*.ai
            **/Edit1.txt
